<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>        
      body { font-family: Arial; background:#fafafa; }         
      h1 { color: #2e75b6; text-align: center; }         
      .box { border: 2px solid #2e75b6; padding: 15px; width: 300px;             
      margin: auto; border-radius: 8px; }         
      #note { color: #c0392b; font-weight: bold; }     
      </style> 
</head>
<body>
<h1>Internal CSS Example</h1>     
<div class="box"> Web Technologies Lab — Department of Computer Applications Page 20         
    <p>This box is styled using a class selector.</p>        
     <p id="note">This line uses an ID selector.</p>    
     </div> 
</body>
</html>
